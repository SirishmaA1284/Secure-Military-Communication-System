{% extends 'base.html' %}
{% block title %}Verify code{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg rounded-4 portal-form portal-{{ portal }}">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-1">{{ info.title }} Login</h3>
                <p class="text-center text-muted small mb-4">Step 2 of 2 &middot; one-time code</p>

                <p class="text-center">
                    Signing in as <strong>{{ username }}</strong>
                    <span class="badge role-badge role-{{ portal }}">{{ portal }}</span>
                </p>

                <form method="POST" autocomplete="off">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="otp" class="form-label">6-digit code from your authenticator app</label>
                        <input type="text" name="otp" id="otp" class="form-control form-control-lg text-center otp-input"
                               inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7"
                               autocomplete="one-time-code" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Verify and sign in</button>
                </form>

                <div class="text-center mt-3 small">
                    <a href="{{ url_for('login') }}">Start over</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
