{% extends 'base.html' %}
{% block title %}{{ info.title }} login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg rounded-4 portal-form portal-{{ portal }}">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-1">{{ info.title }} Login</h3>
                <p class="text-center text-muted small mb-4">Step 1 of 2 &middot; password</p>

                <form method="POST" autocomplete="off">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" name="username" id="username" class="form-control"
                               value="{{ username or '' }}" maxlength="32" autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" name="password" id="password" class="form-control"
                               maxlength="128" autocomplete="current-password" required>
                        <div class="form-text">First time? Use the temporary password you were given.</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Continue</button>
                </form>

                <div class="text-center mt-3 small">
                    <a href="{{ url_for('login') }}">&larr; Choose a different portal</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
